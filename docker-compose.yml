services:
  engine:
    build: ./engine
    restart: unless-stopped
    # Reachable only on the host loopback; the Tailnet path goes through the
    # Tailscale sidecar (network_mode: service:engine), never a public port.
    ports:
      - "127.0.0.1:8420:8420"
    volumes:
      - ./data:/data              # sqlite-vec file — the only durable state
      - ${SEEKER_SOURCES:?set SEEKER_SOURCES in .env}:/sources/home:ro
    environment:
      SEEKER_API_TOKEN: ${SEEKER_API_TOKEN:-dev-insecure-token}
      SEEKER_DB_PATH: /data/seeker.db
      SEEKER_EMBEDDING_BACKEND: ${SEEKER_EMBEDDING_BACKEND:-openai}
      SEEKER_EMBEDDING_MODEL: ${SEEKER_EMBEDDING_MODEL:-nomic-embed-text}
      SEEKER_EMBEDDING_BASE_URL: ${SEEKER_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      SEEKER_EMBEDDING_DIMENSIONS: ${SEEKER_EMBEDDING_DIMENSIONS:-768}
      # Comma-separated directory names pruned from every source (any depth),
      # e.g. build output / dependency trees. Empty = nothing excluded.
      SEEKER_EXCLUDE_DIRS: ${SEEKER_EXCLUDE_DIRS:-}
      # Extra MCP Host patterns (besides loopback), e.g. the Tailscale
      # hostname — "search-engine.your-tailnet.ts.net:*". Empty = loopback only.
      SEEKER_MCP_ALLOWED_HOSTS: ${SEEKER_MCP_ALLOWED_HOSTS:-}
      # LLM endpoint (query rewrite etc. — open decision 1). Inert while
      # rewrite is off, but wired so enabling it later needs no compose edit.
      SEEKER_LLM_BASE_URL: ${SEEKER_LLM_BASE_URL:-http://host.docker.internal:11434}
    # host.docker.internal resolves natively on Docker Desktop; keep the
    # extra_hosts entry so the same file also runs on plain Linux Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tailscale:
    image: tailscale/tailscale:stable
    # Node name on the tailnet (MagicDNS: search-engine.<tailnet>.ts.net).
    # `hostname:` can't be used here — Docker rejects it alongside
    # network_mode: service:<svc> (found 2026-11-04 at first sidecar start).
    network_mode: service:engine   # shares the engine's network namespace
    environment:
      TS_USERSPACE: "false"
      # Persist node identity — without this containerboot runs tailscaled with
      # `--state=mem:` (found 2026-11-05): every start re-registers a new node,
      # re-consuming the auth key and orphaning the previous one in the console.
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: search-engine
      # Preauth key (reusable, non-ephemeral, tagged tag:seeker) from
      # login.tailscale.com/admin/settings/keys. This image's containerboot
      # only supports TS_AUTHKEY — OAuth client creds are silently ignored
      # (no TS_OAUTH_* strings in the binary; found 2026-11-04).
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_EXTRA_ARGS: --advertise-tags=tag:seeker
    volumes:
      - ./ts-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  backup:
    image: restic/restic:0.17.3
    env_file: .env
    volumes:
      - ./data:/data:ro            # back up the index; never write to it
      - ./backup.sh:/backup.sh:ro
    entrypoint: /bin/sh /backup.sh
    restart: unless-stopped
